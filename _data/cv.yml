    Researcher at TikTok in Sydney, Australia (2024–present). Previously a researcher at ByteDance.
    M.S., Institute of Automation, Chinese Academy of Sciences (CASIA), 2017–2020.
    Research interests include multimodal large language models (MLLMs), long-video understanding,
    efficient and sparse attention, hallucination evaluation, and data annotation.

